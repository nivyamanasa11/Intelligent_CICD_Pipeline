<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent CI/CD Pipeline</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Intelligent CI/CD Pipeline</h1>
        <p class="subtitle">Automated Build, Test and Deployment Platform</p>

        <div class="status-card">
            <h2>Application Status</h2>
            <p id="status">Checking status...</p>
            <button onclick="checkStatus()">Check Pipeline Status</button>
        </div>

        <div class="info-card">
            <h2>Pipeline Stages</h2>
            <div class="stages">
                <div class="stage">1. Code</div>
                <div class="stage">2. Build</div>
                <div class="stage">3. Test</div>
                <div class="stage">4. Deploy</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intelligent CI/CD Pipeline</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Intelligent CI/CD Pipeline</h1>

    <p class="subtitle">
        Automated Build, Test and Deployment Platform
    </p>

    <!-- APPLICATION STATUS -->

    <div class="status-card">

        <h2>Application Status</h2>

        <p id="status">
            Checking status...
        </p>

        <button onclick="checkStatus()">
            Check Pipeline Status
        </button>

    </div>


    <!-- PIPELINE STAGES -->

    <div class="info-card">

        <h2>Pipeline Stages</h2>

        <p class="instruction">
            Click any stage to view pipeline information
        </p>


        <div class="stages">

            <!-- CODE -->

            <div class="stage"
                 onclick="openCode()">

                <div class="number">
                    1
                </div>

                <div>
                    Code
                </div>

            </div>


            <!-- BUILD -->

            <div class="stage"
                 onclick="openBuild()">

                <div class="number">
                    2
                </div>

                <div>
                    Build
                </div>

            </div>


            <!-- TEST -->

            <div class="stage"
                 onclick="openTest()">

                <div class="number">
                    3
                </div>

                <div>
                    Test
                </div>

            </div>


            <!-- DEPLOY -->

            <div class="stage"
                 onclick="openDeploy()">

                <div class="number">
                    4
                </div>

                <div>
                    Deploy
                </div>

            </div>

        </div>

    </div>


    <!-- PIPELINE INFORMATION -->

    <div id="pipelineInfo"
         class="info-card">

        <h2>
            CI/CD Flow
        </h2>

        <p>
            Code → Build → Test → Deploy
        </p>

    </div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
